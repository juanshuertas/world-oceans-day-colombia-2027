name: Delegate open issues to agents

on:
  issues:
    types: [opened, labeled, reopened]
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  delegate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Delegate pending issues
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          bash scripts/delegate_pending_issues.sh "${{ github.repository }}"
